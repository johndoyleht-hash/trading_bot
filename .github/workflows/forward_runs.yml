name: forward-runs

on:
  workflow_dispatch:
    inputs:
      full_forward:
        description: "Run full forward + portfolio suite?"
        required: false
        default: "true"

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest gitpython

      - name: Ensure LFS files are materialized
        run: |
          git lfs install
          git lfs pull
          git lfs checkout
          ls -lh data/clean/*/*/*_clean.csv | head -n 10
          head -n 2 $(ls data/clean/*/*/*_clean.csv | head -n 1)

      - name: Run all forward configs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for cfg in configs/forward/*_forward.yaml; do
            base="$(basename "$cfg")"
            pair_lower="${base%%_*}"
            rest="${base#*_}"
            year="${rest%%_*}"
            pair_upper="$(echo "$pair_lower" | tr '[:lower:]' '[:upper:]')"

            echo "=== Running forward for $pair_upper $year ==="
            python3 scripts/baseline_pair_runner.py --pair "$pair_upper" --year "$year" --config "$cfg"
            python3 scripts/print_summary.py --pair "$pair_upper" --year "$year"
          done

      - name: Upload trades artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forward-trades-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            runs/**/trades_log_*.csv
            runs/live_sim/**/trades_*.csv
            runs/live_sim/portfolio/**/combined_trades.csv
            runs/live_sim/portfolio/**/equity_curve.csv

  forward_health:
    name: Forward health (pairs + portfolio)
    needs: forward
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run forward tests
        run: |
          pytest -q -m forward

      - name: Run portfolio tests
        run: |
          pytest -q -m portfolio
