name: forward-runs

on:
  workflow_dispatch:
    inputs:
      full_forward:
        description: "Run full forward + portfolio suite?"
        required: false
        default: "true"

jobs:
  forward:
    runs-on: ubuntu-latest
    env:
      # so scripts can `import src.*` when spawned via subprocess
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Ensure LFS files are materialized
        run: |
          git lfs install
          git lfs pull
          git lfs checkout
          # quick sanity
          ls -lh data/clean/*/*/*_clean.csv | head -n 5 || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- Produce trades for all years we want to guard ---
      - name: Paper-sim 2023
        run: python3 scripts/paper_multi.py --year 2023 --pairs EURUSD,GBPUSD,USDJPY --cfg_dir configs/forward

      - name: Paper-sim 2024
        run: python3 scripts/paper_multi.py --year 2024 --pairs EURUSD,GBPUSD,USDJPY --cfg_dir configs/forward

      - name: Paper-sim 2025
        run: python3 scripts/paper_multi.py --year 2025 --pairs EURUSD,GBPUSD,USDJPY --cfg_dir configs/forward

      # --- Portfolio gates (fail the job if these don't pass) ---
      - name: Portfolio guard — 2024 (PF≥1.20, DD≤7%)
        run: |
          python3 scripts/portfolio_health.py \
            --year 2024 \
            --pairs EURUSD,GBPUSD,USDJPY \
            --use_latest \
            --min_pf 1.20 \
            --max_dd 0.07

      - name: Portfolio guard — 2025 (PF≥1.20, DD≤7%)
        run: |
          python3 scripts/portfolio_health.py \
            --year 2025 \
            --pairs EURUSD,GBPUSD,USDJPY \
            --use_latest \
            --min_pf 1.20 \
            --max_dd 0.07

      - name: Upload trades artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forward-trades-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            runs/**/trades_log_*.csv
            runs/live_sim/**/trades_*.csv
            runs/live_sim/portfolio/**/combined_trades.csv
            runs/live_sim/portfolio/**/equity_curve.csv

  forward_health:
    if: ${{ inputs.full_forward == 'true' }}
    name: Forward health (pairs + portfolio)
    needs: forward
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pyyaml
      - name: Run forward tests
        run: pytest -q -m forward
      - name: Run portfolio tests
        run: pytest -q -m portfolio
